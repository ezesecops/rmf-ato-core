name: tests

# The pipeline itself is not run in CI: it would hammer nist.gov on every push.
# CI proves the code and its rules are sound; the maintainer runs the pipeline.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Verify the manifest is structurally valid
        run: python scripts/01_verify_manifest.py --no-network
